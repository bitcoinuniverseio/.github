name: Feature request
description: Propose a change to a product, protocol, or API
labels: [enhancement]
body:
  - type: input
    id: surface
    attributes:
      label: Product or repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The situation this would improve, stated without the solution
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you want to exist, and any alternatives you considered
    validations:
      required: true
