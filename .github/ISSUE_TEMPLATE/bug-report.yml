name: Bug report
description: Something released is behaving wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, seed phrases, private keys, or personal data. Vulnerabilities go through private vulnerability reporting, never here.
  - type: input
    id: surface
    attributes:
      label: Where
      description: Product, page URL, API route, or component
      placeholder: e.g. https://bitcoinuniverse.io/... or GET /runes/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What the documentation or contract says should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead, with exact errors or responses
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Network, version, and the exact steps
    validations:
      required: true
